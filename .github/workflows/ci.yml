name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Testes usam SQLite auto-contido (conftest), sem Postgres vivo.
      DATABASE_URL: sqlite:///./ci_test.db
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
          # Dependências de teste (pytest + httpx usado pelo TestClient).
          pip install pytest httpx

      - name: Executar testes
        run: pytest -q

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          # jsdom 31 / undici 8 exigem Node >= 22.19.0 (zlib.createZstdDecompress).
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build de produção
        run: npm run build

  docker:
    name: Docker (build das imagens)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar docker-compose
        run: docker compose -f docker-compose.yaml config

      - name: Build backend
        run: docker build -f backend/Dockerfile.dev -t morada-backend:ci ./backend

      - name: Build frontend
        run: docker build -f frontend/Dockerfile.dev -t morada-frontend:ci ./frontend